<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Internal CSS Website</title>

    <!-- INTERNAL CSS -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        /* Navbar */
        header {
            background-color: #333;
            padding: 15px 40px;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h1 {
            color: white;
        }

        nav ul {
            list-style: none;
            display: flex;
        }

        nav ul li {
            margin-left: 20px;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        nav ul li a:hover {
            color: #00c6ff;
        }

        /* Hero Section */
        .hero {
            height: 90vh;
            background: linear-gradient(to right, #00c6ff, #0072ff);
            color: white;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .hero button {
            margin-top: 20px;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        /* Sections */
        section {
            padding: 60px 40px;
            text-align: center;
        }

        .cards {
            display: flex;
            justify-content: center;
            margin-top: 30px;
        }

        .card {
            background: #f4f4f4;
            padding: 30px;
            margin: 10px;
            width: 200px;
            border-radius: 8px;
            font-weight: bold;
        }

        /* Footer */
        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 15px;
        }
    </style>
</head>

<body>

<header>
    <nav>
        <h1>MyWebsite</h1>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>
</header>

<div class="hero">
    <h2>Welcome to My Website</h2>
    <p>Website using Internal CSS</p>
    <button>Get Started</button>
</div>

<section>
    <h2>About Us</h2>
    <p>This website is created using HTML and internal CSS.</p>
</section>

<section>
    <h2>Our Services</h2>
    <div class="cards">
        <div class="card">Web Design</div>
        <div class="card">Development</div>
        <div class="card">SEO</div>
    </div>
</section>

<footer>
    <p>© 2026 MyWebsite</p>
</footer>

</body>
</html>
